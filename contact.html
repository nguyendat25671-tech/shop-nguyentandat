<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - SHOP NGUYỄN TẤN ĐẠT</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body{
      font-family: Arial;
      background:#f5f5f5;
      margin:0;
    }

    .contact-container{
      max-width:1200px;
      margin:auto;
      padding:50px 20px;
    }

    .contact-title{
      text-align:center;
      font-size:45px;
      color:#1f3f7a;
      margin-bottom:10px;
    }

    .contact-sub{
      text-align:center;
      color:#666;
      margin-bottom:50px;
    }

    .contact-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    .contact-info h2,
    .contact-form h2{
      color:#1f3f7a;
      margin-bottom:20px;
    }

    .contact-info p{
      margin:15px 0;
      color:#444;
      line-height:1.6;
    }

    .contact-form input,
    .contact-form textarea{
      width:100%;
      padding:15px;
      margin-bottom:15px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
    }

    .contact-form textarea{
      min-height:120px;
      resize:none;
    }

    .contact-form button{
      background:#ff9a4d;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .contact-form button:hover{
      background:#ff7b1a;
    }

    @media(max-width:768px){

      .contact-box{
        grid-template-columns:1fr;
      }

      .contact-title{
        font-size:35px;
      }

    }

  </style>
<header class="header">
    <div class="logo">
        <h2>SHOP NGUYỄN TẤN ĐẠT</h2>
    </div>

    <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="index.html#products">Sản Phẩm</a>
        <a href="index.html#features">Cam Kết</a>
        <a href="index.html#reviews">Đánh Giá</a>
        <a href="index.html#blog">Tin Tức</a>
        <a href="contact.html" class="active">Liên Hệ</a>
    </nav>
</header>
</head>
<body>

  <div class="contact-container">

    <h1 class="contact-title">
      LIÊN HỆ
    </h1>

    <p class="contact-sub">
      SHOP NGUYỄN TẤN ĐẠT luôn sẵn sàng hỗ trợ bạn
    </p>

    <div class="contact-box">

      <!-- LEFT -->

      <div class="contact-info">

        <h2>Thông tin liên hệ</h2>

        <p>
          📍 Địa chỉ: Như Lân , Nghĩa Trụ , Hưng Yên   </p>

        <p>
          📞 Hotline:
          0345 085 074
        </p>

        <p>
          📧 Email:
          nguyentandat25671@gmail.com
        </p>

        <p>
          💬 Facebook:
          NGUYỄN TẤN ĐẠT
        </p>

      </div>

      <!-- RIGHT -->

      <div class="contact-form">

        <h2>Gửi tin nhắn</h2>

        <input
          type="text"
          placeholder="Tên của bạn"
        >

        <input
          type="email"
          placeholder="Email của bạn"
        >

        <input
          type="text"
          placeholder="Số điện thoại"
        >

        <textarea
          placeholder="Nội dung..."
        ></textarea>

        <button>
          Gửi liên hệ
        </button>

      </div>

    </div>

  </div>
</body>
</html>
